architectury {
	platformSetupLoomIde()
	neoForge()
}

base {
	archivesName = "${mod_name}-${project.name}-${minecraft_version}"
}

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath

	runs {
		data {
			data()
			programArgs "--all", "--mod", "agricraft"
			programArgs "--output", project(":neoforge").file("src/generated/resources").absolutePath
			programArgs "--existing", project(":common").file("src/main/resources").absolutePath
			programArgs "--existing", project(":neoforge").file("src/main/resources").absolutePath
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += project(":neoforge").file("src/generated/resources").absolutePath
			exclude '.cache'
		}
	}
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

apply from: 'starfield-dependency.gradle'

dependencies {
	neoForge "net.neoforged:neoforge:$neoforge_version"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

	modCompileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
	modLocalRuntime("mezz.jei:jei-$minecraft_version-neoforge:$jei_version") { transitive = false }

	modImplementation "curse.maven:jade-324717:$jade_forge_version"
	modCompileOnly("maven.modrinth:the-one-probe:$theoneprobe_version") { transitive = false }

	// Compile-only APIs for optional mod compat plugins (fetched from the Modrinth maven)
	modCompileOnly("maven.modrinth:mystical-agriculture:8.0.27") { transitive = false }
	modCompileOnly("maven.modrinth:cucumber:8.0.16") { transitive = false }
	modCompileOnly("maven.modrinth:industrial-foregoing:1.21-3.6.39") { transitive = false }
	modCompileOnly("maven.modrinth:titanium:1.21-4.0.45") { transitive = false }
	modCompileOnly("maven.modrinth:pneumaticcraft-repressurized:8.2.21") { transitive = false }

	// Create (optional) - only needed to compile the built-in Create harvester compat mixin.
	// Create is an optional runtime dependency; the mixin config is marked required=false so
	// AgriCraft still loads fine when Create is absent.
	modCompileOnly("com.simibubi.create:create-$minecraft_version:$create_version:slim") { transitive = false }
	modCompileOnly("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_version")
	modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-$minecraft_version:$flywheel_version")
	modCompileOnly("com.tterrag.registrate:Registrate:$registrate_version")
}

shadowJar {
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set "dev-shadow"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set null
	atAccessWideners.add "agricraft.accesswidener"
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

// Iteration 0 is a separate development probe, never part of the release mod.
// Keep these exclusions even without the profile: resource-copy tasks can retain old outputs.
tasks.withType(AbstractArchiveTask).configureEach {
	exclude 'com/agricraft/agricraft/starfield/prototype/**'
	exclude 'data/agricraft/structure/starfield_probe.nbt'
	exclude 'data/minecraft/worldgen/world_preset/flat.json'
	exclude 'data/agricraft/starfield_probe_catalog.json'
	exclude 'data/agricraft/agricraft/mutations/starfield_probe.json'
    exclude 'agricraft-save-diagnostics.mixins.json'
}
if (providers.gradleProperty('starfieldPrototype').isPresent()) {
	apply from: 'starfield-prototype.gradle'
} else {
	// Copy tasks may retain resources from an earlier opt-in run. Remove the test
	// preset before an ordinary dev launch can load it without Starfield installed.
	tasks.named('processResources') {
		doFirst {
			delete new File(destinationDir, 'data/minecraft/worldgen/world_preset/flat.json')
			delete new File(destinationDir, 'data/agricraft/structure/starfield_probe.nbt')
			delete new File(destinationDir, 'data/agricraft/starfield_probe_catalog.json')
			delete new File(destinationDir, 'data/agricraft/agricraft/mutations/starfield_probe.json')
            delete new File(destinationDir, 'agricraft-save-diagnostics.mixins.json')
		}
	}
}
