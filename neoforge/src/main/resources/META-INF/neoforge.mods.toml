modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="https://github.com/Vivoxti/AgriCraft-ReReloaded/issues"

[[mods]]
modId="agricraft"
version="${version}"
displayName="AgriCraft"
displayURL="https://www.curseforge.com/minecraft/mc-mods/agricraft-rereloaded"
updateJSONURL = "https://raw.githubusercontent.com/Vivoxti/AgriCraft-ReReloaded/1.21.1/version.json"
logoFile="logo.png"
authors="InfinityRaider, Ketheroth, coredex-source"
description='''
Agricultural farming extended
'''

[[dependencies.agricraft]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.agricraft]]
modId = "minecraft"
type="required"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.agricraft]]
modId = "resourcefulconfig"
type="required"
versionRange = "[${resourcefulconfig_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "agricraft-common.mixins.json"

# Built-in Create compat (harvester). Only applies when Create is installed; the config is
# marked required=false so this is a no-op otherwise.
[[mixins]]
config = "agricraft-neoforge.mixins.json"

[[mixins]]
config = "agricraft-starfield.mixins.json"

[[dependencies.agricraft]]
modId="create"
type="optional"
versionRange="[6.0.0,6.1.0)"
ordering="AFTER"
side="BOTH"

# The compatibility loader validates supported versions without preventing AgriCraft
# from starting alongside an older/newer Starfield with the integration disabled.
[[dependencies.agricraft]]
modId="stardewcraft"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
